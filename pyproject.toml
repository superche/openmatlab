[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "openmatlab"
version = "0.0.2"
description = "Open MATLAB-compatible language, runtime, and libraries (clean-room / public specs)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Shaw Che", email = "superche@users.noreply.github.com" }]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 1 - Planning",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]

[project.scripts]
openmatlab = "openmatlab.host.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "PyYAML>=6",
    "pytest-cov>=4",
    "pytest-bdd>=7",
]
numpy = ["numpy>=1.24"]
plot = ["matplotlib>=3.7"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
markers = [
    "unit: fast unit / architecture tests",
    "bdd: Gherkin / pytest-bdd scenarios",
    "conformance: golden / public-spec cases",
    "interactive: REPL/plot smoke",
    "slow: long-running tests",
    "needs_numpy: requires NumPy",
    "needs_matplotlib: requires Matplotlib",
]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["openmatlab"]

[tool.coverage.report]
fail_under = 60
show_missing = true
skip_empty = true
