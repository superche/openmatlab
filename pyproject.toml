[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "openmatlab"
version = "0.0.1"
description = "Open MATLAB-compatible language, runtime, and libraries (clean-room / public specs)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Shaw Che", email = "superche@users.noreply.github.com" }]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 1 - Planning",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]

[project.scripts]
openmatlab = "openmatlab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = ["pytest>=7"]
