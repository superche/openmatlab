id: community.signal
version: 0.1.0
displayName: Community Signal (Octave Forge–compatible windows)
description: >
  Clean-room MIT subset of popular Octave Forge / MATLAB signal window APIs
  (hamming, rectwin, blackman). Not a MathWorks toolbox; no GPL sources copied.
engines:
  openmatlab: ">=0.1.0 <0.2.0"
main: extension.py
activation:
  - onCommand:community.signal.demo
  - onStartupFinished
contributes:
  commands:
    - command: community.signal.demo
      title: "Signal: Demo (hamming)"
  menus:
    - path: Tools/Signal
      command: community.signal.demo
  panels:
    - id: community.signal.panel
      title: Signal
  pathEntries:
    - relative: mfiles
  uxHints:
    defaultPanels:
      - community.signal.panel
