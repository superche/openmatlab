id: community.signal
version: 0.1.0
displayName: Community Signal Helpers
description: Example domain plugin (not a MathWorks toolbox) — contract-aligned sample
engines:
  openmatlab: ">=0.1.0 <0.2.0"
main: extension.py
activation:
  - onCommand:community.signal.demo
  - onStartupFinished
contributes:
  commands:
    - command: community.signal.demo
      title: "Signal: Demo"
  menus:
    - path: Tools/Signal
      command: community.signal.demo
  panels:
    - id: community.signal.panel
      title: Signal
  pathEntries:
    - relative: mfiles
  uxHints:
    defaultPanels:
      - community.signal.panel
