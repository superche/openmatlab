name: corpus

# M12 corpus gate (Epic #764). The corpus code (GPL/GFDL sources included) is fetched at runtime
# into corpus/cache/ and is never committed. PRs run a sample; the full corpus runs nightly.
on:
  pull_request:
    paths: ["src/**", "corpus/**", ".github/workflows/corpus.yml"]
  schedule:
    - cron: "17 18 * * *"   # 02:17 Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Rosetta pin hash
        id: rosetta-key
        run: echo "key=$(python -m openmatlab.qa.corpus rosetta-key)" >> "$GITHUB_OUTPUT"
      # runner.temp is a step context, not a job-env context. Later steps read this from GITHUB_ENV.
      - name: Corpus cache directory
        run: echo "OPENMATLAB_CORPUS_CACHE=${{ runner.temp }}/openmatlab-corpus" >> "$GITHUB_ENV"
      # Rosetta Code answers GitHub-hosted runners with HTTP 403. Restore the pinned
      # entries from the cache, or from the corpus-rosetta release asset on a miss.
      - name: Restore pinned Rosetta cache
        id: rosetta-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/openmatlab-corpus/rosetta
          key: rosetta-${{ steps.rosetta-key.outputs.key }}
      - name: Seed Rosetta entries when the cache is missing or incomplete
        run: python -m openmatlab.qa.corpus restore-rosetta
      - name: Fetch corpus at the pins (runtime only)
        id: fetch
        run: python -m openmatlab.qa.corpus fetch
      - name: Run (sample on PRs, full nightly)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then S=10; else S=0; fi
          python -m openmatlab.qa.corpus run --sample "$S" --out /tmp/corpus-results.json
      - name: Report
        if: ${{ always() && steps.fetch.conclusion == 'success' }}
        run: python -m openmatlab.qa.corpus report --results /tmp/corpus-results.json --baseline docs/corpus/results.json --out /tmp/REPORT.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corpus-report
          path: |
            /tmp/REPORT.md
            /tmp/corpus-results.json
      - name: Regression gate (pass -> fail fails the job)
        run: python -m openmatlab.qa.corpus gate /tmp/corpus-results.json
      - name: File deduplicated corpus issues (nightly)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m openmatlab.qa.corpus triage --results /tmp/corpus-results.json --file --milestone "Real-script compatibility gate"
