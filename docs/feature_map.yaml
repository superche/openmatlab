# OpenMATLAB capability inventory — source of truth for QA status.
# Schema: see docs/QA.md § Feature map
# Status values: planned | stub | partial | done | wontfix
# Clean-room: no MATLAB binary RE. Optional future conformance sources:
#   public MATLAB language docs, Octave (public) behavior — never proprietary blobs.

version: 1
product: openmatlab
updated: "2026-10-11"

layers:
  - id: host
    package: openmatlab.host
  - id: lang
    package: openmatlab.lang
  - id: runtime
    package: openmatlab.runtime
  - id: numerics
    package: openmatlab.numerics
  - id: graphics
    package: openmatlab.graphics
  - id: libs
    package: openmatlab.libs
  - id: qa
    package: openmatlab.qa

features:
  # --- host ---
  - id: host.cli.status
    layer: host
    name: CLI architecture / QA status
    status: partial
    spec: docs/QA.md
    tests: [tests/unit/test_cli_qa.py]
    cases: [tc.cli_features]
    notes: "status/features/cases/defects/test; -e evaluates; REPL default"

  - id: host.cli.version
    layer: host
    name: CLI version
    status: done
    tests: [tests/unit/test_cli_qa.py]

  - id: host.display_policy
    layer: host
    name: DisplayPolicy (semicolon suppress, ans, pretty-print)
    status: done
    spec: docs/ARCHITECTURE.md
    tests: [tests/unit/test_evaluator.py]
    protocols: [openmatlab.host.display.DisplayPolicy]
    notes: "ConsoleDisplay: ans, ';', pretty-print matrices [done per docs/design/ITER-024-feature-done-criteria.md]"

  - id: host.plot_surface
    layer: host
    name: PlotSurface façade
    status: done
    protocols: [openmatlab.host.plot_surface.PlotSurface]
    tests: [tests/unit/test_plot.py]
    notes: "HostPlotSurface.plot/close/show → MatplotlibGraphicsBackend [done per docs/design/ITER-024-feature-done-criteria.md]"

  - id: host.repl
    layer: host
    name: Interactive REPL session
    status: done
    tests: [tests/unit/test_evaluator.py]
    notes: "run_line + bind_runtime; bare openmatlab enters REPL [done per docs/design/ITER-024-feature-done-criteria.md]"

  # --- lang ---
  - id: lang.tokens_reserved
    layer: lang
    name: TokenType vocabulary incl. matrix-reserved
    status: done
    tests: [tests/unit/test_architecture.py, tests/unit/test_lexer.py]
    notes: "Lexer emits matrix tokens for implemented subset"

  - id: lang.ast_matrix_forms
    layer: lang
    name: AST nodes for matrix-first forms
    status: done
    tests: [tests/unit/test_architecture.py, tests/unit/test_parser_matrix.py]
    notes: "Parser produces MatrixLiteral/Index/Colon/Transpose/BinOp"

  - id: lang.lexer
    layer: lang
    name: Lexer tokenize()
    status: done
    tests: [tests/unit/test_lexer.py]
    notes: "Matrix MVP + if/for/while/break/end + STRING; continue/cells later [done ITER-024; #34]"

  - id: lang.parser
    layer: lang
    name: Parser parse()
    status: done
    tests: [tests/unit/test_parser_matrix.py]
    notes: "Matrix MVP + MultiAssign + If/For/While/Break; continue later [done ITER-024; #34]"

  - id: lang.matrix_literal
    layer: lang
    name: "[...] matrix / row literals"
    status: done
    tests: [tests/unit/test_parser_matrix.py]
    depends_on: [lang.lexer, lang.parser]
    notes: "Parsed + evaluated to Array via NumPy backend [done per docs/design/ITER-024-feature-done-criteria.md]"

  - id: lang.indexing_colon
    layer: lang
    name: Indexing A(i,j) and colon expressions
    status: done
    depends_on: [lang.parser]
    notes: "Parsed IndexExpr/ColonExpr; evaluated on ArrayBackend [done per docs/design/ITER-024-feature-done-criteria.md]"
    tests: [tests/unit/test_parser_matrix.py]

  - id: lang.elementwise_ops
    layer: lang
    name: ".* ./ .^ vs * / matmul"
    status: done
    depends_on: [lang.parser]
    tests: [tests/unit/test_parser_matrix.py, tests/bdd/test_matrix_parser_bdd.py]
    notes: "Parsed + evaluated; * matmul vs .* ./ .^ [done per docs/design/ITER-024-feature-done-criteria.md]"

  - id: lang.function_def
    layer: lang
    name: function ... end syntax
    status: done
    depends_on: [lang.parser]
    tests: [tests/unit/test_mfile_functions.py]
    notes: "Parsed FunctionDef; loaded from .m via FunctionResolver [done per docs/design/ITER-024-feature-done-criteria.md]"

  # --- runtime ---
  - id: runtime.value_array_protocol
    layer: runtime
    name: Value / Array protocols (scalar as 1x1)
    status: done
    protocols: [openmatlab.runtime.value.Value, openmatlab.runtime.value.Array]
    tests: [tests/unit/test_architecture.py, tests/unit/test_numpy_backend.py]
    notes: "Satisfied by NDArrayValue (LSP)"

  - id: runtime.workspace
    layer: runtime
    name: Workspace base + frames
    status: partial
    tests: [tests/unit/test_architecture.py]
    notes: "push/pop/get/set; .m calls use fresh Workspace"

  - id: runtime.function_resolver
    layer: runtime
    name: FunctionResolver builtins → path → .m
    status: done
    protocols: [openmatlab.runtime.functions.CallableFunction]
    tests: [tests/unit/test_toolbox_path.py, tests/unit/test_mfile_functions.py]
    notes: "builtins → find_mfile → parse_mfile/MFileCallable cache [done per docs/design/ITER-024-feature-done-criteria.md]"

  - id: runtime.session
    layer: runtime
    name: Session composition root
    status: done
    tests: [tests/unit/test_architecture.py, tests/unit/test_evaluator.py]
    notes: "create_default wires NumPy + display + plot; interactive_plots/env/CI policy [done per docs/design/ITER-024-feature-done-criteria.md]"

  - id: runtime.evaluator
    layer: runtime
    name: AST evaluator
    status: done
    depends_on: [lang.parser, runtime.value_array_protocol, numerics.array_backend]
    tests: [tests/unit/test_evaluator.py]
    notes: "Matrix MVP + control + .m + run(script) [done ITER-024; #34–#36]"

  # --- numerics ---
  - id: numerics.array_backend
    layer: numerics
    name: ArrayBackend protocol
    status: done
    protocols: [openmatlab.numerics.backend.ArrayBackend]
    notes: "Implemented by NumPyArrayBackend"

  - id: numerics.numpy_backend
    layer: numerics
    name: NumPyArrayBackend
    status: done
    depends_on: [numerics.array_backend, runtime.value_array_protocol]
    tests: [tests/unit/test_numpy_backend.py, tests/bdd/test_array_numpy_bdd.py]
    notes: "MVP ops: literal/matmul/elem/index/colon/transpose; complex/sparse later [done per docs/design/ITER-024-feature-done-criteria.md]"

  - id: numerics.array_value
    layer: numerics
    name: Concrete Array value type
    status: done
    depends_on: [runtime.value_array_protocol, numerics.numpy_backend]
    tests: [tests/unit/test_numpy_backend.py]
    notes: "NDArrayValue; scalar as 1x1; LSP vs Array protocol [done per docs/design/ITER-024-feature-done-criteria.md]"

  # --- graphics ---
  - id: graphics.backend
    layer: graphics
    name: GraphicsBackend protocol
    status: done
    protocols: [openmatlab.graphics.backend.GraphicsBackend]

  - id: graphics.matplotlib
    layer: graphics
    name: MatplotlibGraphicsBackend
    status: done
    depends_on: [graphics.backend, host.plot_surface]
    tests: [tests/unit/test_plot.py]
    notes: "Agg default; OPENMATLAB_PLOT_INTERACTIVE + show/drawnow; CI forces Agg [done per docs/design/ITER-024-feature-done-criteria.md]"

  - id: graphics.plot_mvp
    layer: graphics
    name: plot(x,y) MVP
    status: done
    depends_on: [graphics.matplotlib, runtime.evaluator]
    tests: [tests/unit/test_plot.py, tests/bdd/test_plot_bdd.py]
    notes: "plot + show/drawnow builtins; Agg CI-safe; interactive via env/Session [done per docs/design/ITER-024-feature-done-criteria.md]"

  # --- libs ---
  - id: libs.toolbox_path
    layer: libs
    name: ToolboxPath addpath / find_mfile
    status: done
    notes: "API + language addpath/which (double-quoted strings); rmpath lang N/A [done per docs/design/ITER-024-feature-done-criteria.md]"
    tests: [tests/unit/test_toolbox_path.py]

  - id: libs.mfile_loading
    layer: libs
    name: Load .m functions from path
    status: done
    depends_on: [libs.toolbox_path, lang.function_def, runtime.function_resolver]
    notes: "function+script .m; eval_script + language run() [done ITER-024; #35/#36]"
    tests: [tests/unit/test_mfile_functions.py]

  # --- qa ---

  - id: libs.elmat_constructors
    layer: libs
    name: zeros / ones / eye / linspace builtins
    status: partial
    depends_on: [runtime.function_resolver, numerics.numpy_backend]
    notes: "FunctionResolver builtins via libs.numeric_builtins; vector-size form N/A (#44)"
    tests: [tests/unit/test_elmat_builtins.py, tests/bdd/test_elmat_bdd.py]

  - id: libs.elmat_shape
    layer: libs
    name: size / numel / length builtins
    status: partial
    depends_on: [runtime.function_resolver]
    notes: "size(A), size(A,d), [m,n]=size(A); 2-D only (#44)"
    tests: [tests/unit/test_elmat_builtins.py]

  - id: libs.reductions
    layer: libs
    name: sum / prod / mean / min / max
    status: partial
    depends_on: [runtime.function_resolver, numerics.numpy_backend]
    notes: "first non-singleton dim; [m,i]=max; max(A,B); NaN-omit default N/A (#45)"
    tests: [tests/unit/test_reductions.py, tests/bdd/test_reductions_bdd.py]
  - id: qa.feature_map
    layer: qa
    name: Feature map load / dump (sync/export)
    status: partial
    spec: docs/PROCESS.md
    tests: [tests/unit/test_feature_map.py]
    notes: "Optional inventory; Issues are canonical work items"

  - id: qa.unit_suite
    layer: qa
    name: Unit test suite (pytest -m unit)
    status: partial
    tests: [tests/unit/]

  - id: qa.conformance_suite
    layer: qa
    name: Conformance / golden suite
    status: stub
    tests: [tests/conformance/]
    notes: "Placeholders only; future public-docs / optional Octave"

  - id: qa.interactive_suite
    layer: qa
    name: Interactive / plot smoke suite
    status: stub
    tests: [tests/interactive/]

  - id: qa.test_catalog
    layer: qa
    name: Test / use-case catalog load
    status: partial
    spec: docs/QA.md
    tests: [tests/unit/test_catalog.py]
    notes: "Layer 2 inventory"

  - id: qa.defects
    layer: qa
    name: GitHub Issues workflow (gh bridge)
    status: partial
    spec: docs/WORKFLOW.md
    tests: [tests/unit/test_defects.py]
    notes: "Canonical tracker = GitHub Issues; CLI wraps gh"

  - id: qa.layered_system
    layer: qa
    name: Five-layer QA system documented
    status: partial
    spec: docs/QA.md
    tests: [tests/unit/test_catalog.py, tests/unit/test_defects.py, tests/unit/test_feature_map.py]
    notes: "Off-the-shelf Issues/pytest/gh; YAML inventories only"

  - id: qa.pytest_bdd
    layer: qa
    name: Gherkin scenarios via pytest-bdd
    status: partial
    spec: docs/PROCESS.md
    tests: [tests/bdd/]
    notes: "features/*.feature; CI runs unit or bdd"

  - id: qa.ci_gates
    layer: qa
    name: GitHub Actions CI quality gates
    status: done
    spec: docs/PROCESS.md
    notes: "Live .github/workflows/ci.yml; required check test on main; unit+bdd, cov>=60; example retained at docs/examples/"

  - id: qa.process_dod
    layer: qa
    name: R&D process + Definition of Done
    status: partial
    spec: docs/PROCESS.md
    notes: "CONTRIBUTING + PR template checklist"
