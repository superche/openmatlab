# OpenMATLAB test / use-case catalog (QA layer 2)
# Schema: docs/QA.md § Layer 2
version: 1
product: openmatlab
updated: "2026-10-23"

use_cases:
  - id: uc.matrix_first_repl
    title: Interactive matrix compute and display
    actor: scientific user
    goal: Enter arrays, operate, see pretty-print; suppress with ';'
    features:
      - lang.matrix_literal
      - lang.elementwise_ops
      - runtime.evaluator
      - host.display_policy
    priority: p0
    narrative: docs/use_cases/matrix_first_repl.md

  - id: uc.plot_tweak
    title: Plot vectors and tweak in session
    actor: scientific user
    goal: plot(x,y) from workspace values
    features: [graphics.plot_mvp, host.plot_surface, runtime.session]
    priority: p0

  - id: uc.script_function_path
    title: Run scripts and resolve functions on path
    actor: power user
    goal: .m functions via ToolboxPath
    features: [libs.mfile_loading, runtime.function_resolver, lang.function_def]
    priority: p1

  - id: uc.cmapss_fd001
    title: Download NASA C-MAPSS FD001 and read it with readtable
    actor: scientific user
    goal: Runtime Zenodo fetch and a PHM08-named table of train_FD001
    features: [libs.cmapss_fd001, libs.table_io]
    priority: p0

  - id: uc.cmapss_preprocess
    title: Drop near-constant FD001 sensors and smooth one unit
    actor: scientific user
    goal: smoothdata movmean and gaussian on one unit, raw and smoothed on one axes
    features: [libs.smoothdata, libs.cmapss_fd001]
    priority: p0

  - id: uc.cmapss_metrics
    title: Report FD001 early/late means, sensor correlation, and train RUL
    actor: scientific user
    goal: groupsummary failure cycles and RUL, early versus late sensor means, Pearson correlation
    features: [libs.cmapss_metrics, libs.table_join_group, libs.cmapss_fd001]
    priority: p0

  - id: uc.cmapss_figure
    title: FD001 lab-meeting figure with a correlation heatmap
    actor: scientific user
    goal: One tiledlayout figure with sensor traces, early/late, heatmap, failure cycle, and RUL
    features: [libs.graphics.heatmap, libs.graphics.layout, libs.cmapss_metrics]
    priority: p0

  - id: uc.cmapss_export
    title: Take the FD001 lab figure away as PNG and PDF
    actor: scientific user
    goal: exportgraphics writes a 300 dpi PNG and PDF whose crop keeps the title, colorbar and footnote
    features: [libs.graphics.figio, libs.graphics.heatmap]
    priority: p0

  - id: uc.mitbih_record100
    title: Download MIT-BIH record 100 and read it in millivolts
    actor: scientific user
    goal: Runtime PhysioNet fetch and a two-channel ECG at 360 Hz, in mV
    features: [libs.mitbih_record100]
    priority: p0

  - id: uc.mitbih_bandpass
    title: Zero-phase bandpass of one MIT-BIH channel
    actor: scientific user
    goal: Filter record 100 MLII at about 0.5-40 Hz and compare raw vs filtered on one axes
    features: [libs.filtfilt, libs.mitbih_record100]
    priority: p0

  - id: uc.mitbih_peaks
    title: R peaks, RR histogram, and an amplitude spectrum of record 100
    actor: scientific user
    goal: Mark R peaks on filtered MLII, summarize RR, and show one channel spectrum
    features: [libs.findpeaks, libs.filtfilt, libs.mitbih_record100]
    priority: p0

  - id: uc.mitbih_labfigure
    title: One lab-meeting figure for MIT-BIH record 100
    actor: scientific user
    goal: A 2x2 tiledlayout of raw MLII, filtered R peaks, RR, and the spectrum, with a citation footnote
    features: [libs.mitbih_labfigure, libs.findpeaks, libs.filtfilt, libs.mitbih_record100]
    priority: p0

  - id: uc.mitbih_export
    title: Take the record-100 lab figure away as PNG and PDF
    actor: scientific user
    goal: exportgraphics writes a 300 dpi PNG and PDF whose crop keeps the title and the citation footnote
    features: [libs.mitbih_export, libs.graphics.figio, libs.mitbih_labfigure]
    priority: p0

